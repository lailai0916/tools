<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>lailai's Tools</title>
    <meta name="description" content="Handy tools for developers, by lailai." />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('lailai.theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = preference === 'light' || preference === 'dark' ? preference : system;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference || 'system';
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
    <script>
      // Umami analytics, injected dynamically: Vite rewrites a static
      // <script src> in index.html and strips its data-* attributes, which
      // would drop the website id. Building the element in JS keeps it intact.
      (function () {
        var s = document.createElement('script');
        s.defer = true;
        s.src = 'https://analytics.lailai.one/script.js';
        s.setAttribute('data-website-id', '8563fa7d-0ea3-49c8-b390-89aa3d997905');
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
