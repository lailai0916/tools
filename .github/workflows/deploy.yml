name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run check:guides && npm run check:workbenches && npm run build && npm run check:performance

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        # --no-o --no-g: the runner's uid (1001) must not follow the files onto the
        # server. The main site's deploy does preserve it, which once let a newly
        # created local user inherit ownership of /var/www/lailai.one by uid collision.
        run: |
          rsync -rlptz --delete --no-o --no-g \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "${SERVER_USER}@${SERVER_HOST}:/var/www/tools.lailai.one/"

      - name: Verify deployed website
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            "https://tools.lailai.one/?deployment=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-index.html"
          cmp dist/index.html "$RUNNER_TEMP/deployed-index.html"
          python3 - <<'PY' > "$RUNNER_TEMP/deployed-assets.txt"
          import pathlib, re
          html = pathlib.Path('dist/index.html').read_text()
          for asset in sorted(set(re.findall(r'(?:src|href)=[\"\'](/assets/[^\"\']+)', html))):
              print(asset)
          PY
          while IFS= read -r asset; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
              "https://tools.lailai.one$asset?deployment=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-asset"
            cmp "dist$asset" "$RUNNER_TEMP/deployed-asset"
          done < "$RUNNER_TEMP/deployed-assets.txt"
          for route in data-workbench json-to-ts; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
              "https://tools.lailai.one/$route?deployment=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-route.html"
            cmp "dist/$route.html" "$RUNNER_TEMP/deployed-route.html"
          done
          for route in sql-formatter removed-tool-check; do
            status=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
              -o /dev/null -w '%{http_code}' "https://tools.lailai.one/$route?deployment=$GITHUB_SHA")
            test "$status" = 404
          done
